<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokkan Battle Event Editor</title>
    <link rel="stylesheet" href="style/style.css" />
    <link rel="shortcut icon" href="images/favicon.ico" />
</head>
<body>

    <div class="header">
        <div class="header-content">
            <nav class="nav-bar">
                <a href="Eventcreator.html" class="logo-section">
                    <div class="logo"><img src="images/favicon.svg" alt="logo" onerror="this.src='https://images.unsplash.com/photo-1549813069-f95e44d7f498?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80'"style="height 50px; width: 50px; margin: 50px;"></div>
                    <div class="logo-text">
                        <h1 class="logo-title">Dokkan Eclipse</h1>
                        <p class="logo-subtitle">Event Editor Website</p>
                    </div>
                </a>
                <div class="nav-menu">
                    <a href="patches-sql-maker.html" class="nav-btn primary">
                        🔧 Patches SQL Maker
                    </a>
                    <a href="event-sql-maker.html" class="nav-btn secondary">
                        ⚔️ Event SQL Maker
                    </a>
                </div>
            </nav>
        </div>
    </div>
        
        <div class="main-content">
            <div class="section">
                <h2 class="section-title">⚔️ Battle Phases</h2>
                <div id="phasesContainer" class="phases-container">
                    <!-- Phases are generated here-->
                </div>
                <button class="add-phase-btn" onclick="addPhase()">
                    ➕ Add Phase
                </button>
            </div>
            
            <div class="export-section">
                <h2 class="section-title">📤 JSON Export</h2>
                <div class="export-controls">
                    <button class="btn btn-primary" onclick="updateJSON()">🔄 Update JSON</button>
                    <button class="btn btn-success" onclick="copyJSON()">📋 Copy JSON</button>
                    <button class="btn btn-warning" onclick="loadFromJSON()">📥 Load JSON</button>
                </div>
                <div id="jsonOutput" class="json-output"></div>
            </div>
        </div>
    </div>

    <!-- Modal pour sélection des skills -->
    <div id="skillModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🗡️ Select Enemy Skills</h2>
                <span class="close" onclick="closeSkillModal()">&times;</span>
            </div>
            <div class="modal-body">
                <div class="search-container">
                    <input type="text" id="skillSearch" placeholder="Search skills by name, description or ID..." 
                           onkeyup="searchSkills()" class="search-input">
                    <button class="btn btn-primary" onclick="searchSkills()">🔍 Search</button>
                </div>
                
                <div class="selected-skills">
                    <h3>Selected Skills:</h3>
                    <div id="selectedSkillsList"></div>
                </div>
                
                <div class="skills-list" id="skillsList">
                    <!-- Skills will be loaded here -->
                </div>
                
                <div class="pagination" id="skillsPagination">
                    <!-- Pagination controls -->
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-success" onclick="confirmSkillSelection()">✅ Confirm Selection</button>
                <button class="btn btn-secondary" onclick="closeSkillModal()">❌ Cancel</button>
            </div>
        </div>
    </div>

    <script src="script/script.js"></script>
</body>
</html>
