<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokkan Eclipse - Event SQL Generator</title>
        <link rel="shortcut icon" href="images/favicon.ico" />
            <link rel="stylesheet" href="style/style2.css" />

</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <nav class="nav-bar">
                    <a href="#" class="logo-section">
                        <div class="logo">
                            <img src="images/favicon.svg" alt="logo" onerror="this.src='https://images.unsplash.com/photo-1549813069-f95e44d7f498?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80'">
                        </div>
                        <div class="logo-text">
                            <h1 class="logo-title">Dokkan Eclipse</h1>
                            <p class="logo-subtitle">Event Editor Website</p>
                        </div>
                    </a>
                    <div class="nav-menu">
                        <a href="index.html" class="nav-btn primary">
                            🔧 JSON Maker
                        </a>
                    </div>
                </nav>
            </div>
        </div>

        <div class="main-content">
            <div class="section">
                <h2 class="section-title">📋 Event Configuration</h2>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="eventId">Event ID (3 digits)</label>
                        <input type="number" id="eventId" min="100" max="999" placeholder="e.g., 785" onchange="updateIds()">
                    </div>
                    
                    <div class="form-group">
                        <label for="eventCategory">Event Category</label>
                        <select id="eventCategory">
                            <option value="12">Awakening</option>
                            <option value="20">Challenge</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventName">Event Name</label>
                        <input type="text" id="eventName" placeholder="e.g., Vegito Mania">
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="bannerImageUrl">Banner Image URL</label>
                        <input type="url" id="bannerImageUrl" placeholder="https://example.com/banner.png" onchange="previewImage('bannerImageUrl', 'bannerPreview')">
                        <div id="bannerPreview" class="image-preview">
                            <span class="loading">No image</span>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventImageUrl">Event Image URL</label>
                        <input type="url" id="eventImageUrl" placeholder="https://example.com/event.png" onchange="previewImage('eventImageUrl', 'eventPreview')">
                        <div id="eventPreview" class="image-preview">
                            <span class="loading">No image</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="section">
                <h2 class="section-title">🎯 Stages Configuration</h2>
                
                <div id="stagesContainer" class="stages-container">
                    <!-- Stages will be added here dynamically -->
                </div>
                
                <button class="add-stage-btn" onclick="addStage()">
                    ➕ Add New Stage
                </button>
            </div>

            <div class="section">
                <button class="generate-btn" onclick="generateSQL()">
                    🚀 Generate SQL
                </button>
                
                <div id="sqlOutput" class="output-section" style="display: none;"></div>
            </div>
        </div>
    </div>

        <div class="footer">
        <div class="footer-content">
            <p class="footer-subtitle">Made by TAYOKEN A.K.A Yanis</p>
        </div>
    </div>

    <script src="script/script2.js"></script>

</body>
</html>
